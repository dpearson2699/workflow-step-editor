[package]
name = "workflow-step-editor"
version = "0.1.0"
description = "Records desktop workflow steps from real clicks and key presses"
authors = ["Derek Pearson"]
edition = "2021"

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "workflow_step_editor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"
core-foundation-sys = "0.8"
core-graphics = "0.25.0"
accessibility-sys = "0.2.0"
foreign-types = "0.5"
objc2 = "0.6.4"
objc2-foundation = "0.3.2"
objc2-screen-capture-kit = "0.3.2"
objc2-core-media = "0.3.2"
objc2-core-video = "0.3.2"
block2 = "0.6.2"
dispatch2 = "0.3.1"
png = "0.18.1"

[dev-dependencies]
tempfile = "3"
